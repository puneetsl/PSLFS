[package]
name = "pslfs-v2"
version = "0.1.0"
edition = "2024"

[lib]
name = "pslfs"
path = "src/lib.rs"

[[bin]]
name = "pslfs"
path = "src/main.rs"

[[bench]]
name = "allocator_benchmarks"
harness = false

[[bench]]
name = "storage_benchmarks"
harness = false

[dependencies]
thiserror = "1.0"
tempfile = "3.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.bench]
opt-level = 3
debug = false
lto = true
